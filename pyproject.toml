[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catch-cpp"
version = "0.1.0"
description = "A Cargo-like command-line tool for C++ projects wrapping CMake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
catch = "catch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["catch*"]
